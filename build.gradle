plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Mapeo "compat" de Ice 3.7 (paquete Ice.*), el mismo de los ejemplos de clase
    implementation 'com.zeroc:ice-compat:3.7.10'

    // Solo los usa el nodo de persistencia
    runtimeOnly 'com.h2database:h2:2.2.224'
    runtimeOnly 'org.postgresql:postgresql:42.7.8'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------- Slice -> Java

def sliceDir = file('slice')
def sliceSalida = layout.buildDirectory.dir('generated/slice')

tasks.register('slice2java', Exec) {
    group = 'ice'
    description = 'Genera las clases Java del contrato Slice (slice2java --compat).'
    inputs.dir sliceDir
    outputs.dir sliceSalida
    doFirst { sliceSalida.get().asFile.mkdirs() }
    executable 'slice2java'
    args '--compat', '--output-dir', sliceSalida.get().asFile.path
    args fileTree(sliceDir) { include '*.ice' }.files.collect { it.path }
}

sourceSets.main.java.srcDir(sliceSalida)
tasks.named('compileJava') { dependsOn 'slice2java' }

// ------------------------------------------------- un jar por nodo del diagrama
//
// Cada jar es el artefacto que se despliega en su nodo:
//   persistencia.jar -> Servidor Base de Datos Transaccional
//   pagos.jar        -> Servidor de Pasarelas y Estrategias de Pago
//   backend.jar      -> Servidor E-Commerce (Backend Core)
//   cliente.jar      -> simula WebApp / MobileApp

def librerias = { boolean conJdbc ->
    configurations.runtimeClasspath.filter { lib ->
        conJdbc || !(lib.name.startsWith('h2-') || lib.name.startsWith('postgresql-'))
    }
}

def artefacto = { String nombre, String claseMain, boolean conJdbc ->
    tasks.register("${nombre}Jar", Jar) {
        group = 'apexstore'
        description = "Empaqueta ${nombre}.jar"
        archiveFileName = "${nombre}.jar"
        manifest { attributes 'Main-Class': claseMain }

        from(sourceSets.main.output) {
            include 'ApexStore/**'
            include 'com/apexstore/comun/**'
            include "com/apexstore/${nombre}/**"
        }
        from({ librerias(conJdbc).collect { zipTree(it) } }) {
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**', 'module-info.class'
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

artefacto('persistencia', 'com.apexstore.persistencia.ServidorBaseDatos', true)
artefacto('pagos', 'com.apexstore.pagos.ServidorPasarelas', false)
artefacto('backend', 'com.apexstore.backend.ServidorECommerce', false)
artefacto('cliente', 'com.apexstore.cliente.ClienteApp', false)

tasks.named('jar') { enabled = false }
tasks.named('assemble') {
    dependsOn 'persistenciaJar', 'pagosJar', 'backendJar', 'clienteJar'
}
